<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeKidedia Bot 2026 - Your AI-powered knowledge assistant with integrated web search engine. Search like Google & Bing or chat with our AI bot.">
    <meta name="keywords" content="AI, bot, knowledge, search engine, Wikipedia, Google, Bing, 2026">
    <title>WeKidedia 2026 - AI Knowledge Assistant & Web Search</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.6); }
        }
        .glow-pulse {
            animation: pulse-glow 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Import Lucide icons
        const Send = lucide.Send;
        const Bot = lucide.Bot;
        const Book = lucide.Book;
        const Zap = lucide.Zap;
        const Shield = lucide.Shield;
        const Globe = lucide.Globe;
        const Mail = lucide.Mail;
        const MessageSquare = lucide.MessageSquare;
        const Search = lucide.Search;
        const User = lucide.User;
        const X = lucide.X;
        const Sparkles = lucide.Sparkles;
        const TrendingUp = lucide.TrendingUp;
        const Award = lucide.Award;
        const Clock = lucide.Clock;
        const CheckCircle = lucide.CheckCircle;
        const ArrowRight = lucide.ArrowRight;

        const Icon = ({ icon: IconComponent, ...props }) => {
            if (!IconComponent) return null;
            return React.createElement(IconComponent, props);
        };

        const WeKidediaWebsite = () => {
          const [activeSection, setActiveSection] = useState('home');
          const [messages, setMessages] = useState([
            { type: 'bot', text: 'Hello! I\'m WeKidedia Bot. Ask me anything for Wikipedia-style information, or use our Web Search feature to search the entire internet!' }
          ]);
          const [inputMessage, setInputMessage] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const messagesEndRef = useRef(null);
          const [formData, setFormData] = useState({ name: '', email: '', message: '' });
          const [formSubmitted, setFormSubmitted] = useState(false);
          
          const [showRegisterBot, setShowRegisterBot] = useState(false);
          const [registeredBots, setRegisteredBots] = useState([]);
          const [botFormData, setBotFormData] = useState({
            botName: '',
            botDescription: '',
            ownerName: '',
            ownerEmail: '',
            apiEndpoint: '',
            category: 'general',
            features: ''
          });
          const [botRegSubmitted, setBotRegSubmitted] = useState(false);
          const [loadingBots, setLoadingBots] = useState(true);
          const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
          
          const [searchQuery, setSearchQuery] = useState('');
          const [searchResults, setSearchResults] = useState([]);
          const [isSearching, setIsSearching] = useState(false);
          const [searchEngine, setSearchEngine] = useState('google');
          const [hasSearched, setHasSearched] = useState(false);

          useEffect(() => {
            const handleMouseMove = (e) => {
              setMousePosition({ x: e.clientX, y: e.clientY });
            };
            window.addEventListener('mousemove', handleMouseMove);
            return () => window.removeEventListener('mousemove', handleMouseMove);
          }, []);

          const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          };

          useEffect(() => {
            scrollToBottom();
          }, [messages]);

          useEffect(() => {
            loadRegisteredBots();
            lucide.createIcons();
          }, []);

          useEffect(() => {
            lucide.createIcons();
          }, [activeSection, showRegisterBot, searchResults, messages]);

          const loadRegisteredBots = async () => {
            try {
              setLoadingBots(true);
              const keys = await window.storage.list('bot:');
              if (keys && keys.keys) {
                const bots = [];
                for (const key of keys.keys) {
                  const result = await window.storage.get(key);
                  if (result && result.value) {
                    bots.push(JSON.parse(result.value));
                  }
                }
                setRegisteredBots(bots);
              }
            } catch (error) {
              console.log('No bots registered yet');
              setRegisteredBots([]);
            } finally {
              setLoadingBots(false);
            }
          };

          const handleBotRegistration = async () => {
            if (!botFormData.botName || !botFormData.ownerName || !botFormData.ownerEmail) {
              alert('Please fill all required fields');
              return;
            }

            try {
              const botId = `bot:${Date.now()}`;
              const botData = {
                id: botId,
                ...botFormData,
                registeredAt: new Date().toISOString(),
                status: 'active'
              };

              await window.storage.set(botId, JSON.stringify(botData));
              
              setBotRegSubmitted(true);
              await loadRegisteredBots();
              
              setTimeout(() => {
                setBotRegSubmitted(false);
                setBotFormData({
                  botName: '',
                  botDescription: '',
                  ownerName: '',
                  ownerEmail: '',
                  apiEndpoint: '',
                  category: 'general',
                  features: ''
                });
                setShowRegisterBot(false);
              }, 3000);
            } catch (error) {
              console.error('Error registering bot:', error);
              alert('Failed to register bot. Please try again.');
            }
          };

          const getBotResponse = (userMessage) => {
            const msg = userMessage.toLowerCase();
            
            if (msg.includes('hello') || msg.includes('hi')) {
              return 'Hello! I can help you find information on any topic. Try asking me about science, history, geography, or any subject you\'re curious about!';
            } else if (msg.includes('how') && msg.includes('work')) {
              return 'I work by analyzing your question and searching through a vast knowledge base similar to Wikipedia. I then provide you with accurate, concise information along with sources when available.';
            } else if (msg.includes('india') || msg.includes('country')) {
              return 'India, officially the Republic of India, is a country in South Asia. It is the seventh-largest country by area, the most populous country, and the most populous democracy in the world. India has a rich cultural heritage dating back thousands of years.';
            } else if (msg.includes('python') || msg.includes('programming')) {
              return 'Python is a high-level, interpreted programming language created by Guido van Rossum in 1991. Known for its simplicity and readability, it\'s widely used in web development, data science, AI, and automation.';
            } else if (msg.includes('ai') || msg.includes('2026')) {
              return 'By 2026, AI technology has advanced significantly with improved natural language understanding, better contextual awareness, and more ethical AI frameworks. AI assistants like me are now more accurate and helpful than ever!';
            } else {
              return `I'd search for information about "${userMessage}" in my knowledge base. In a real implementation, I would connect to Wikipedia's API or a custom knowledge database to provide detailed, accurate information with sources.`;
            }
          };

          const handleSendMessage = () => {
            if (inputMessage.trim() === '') return;

            const userMsg = { type: 'user', text: inputMessage };
            setMessages([...messages, userMsg]);
            setInputMessage('');
            setIsTyping(true);

            setTimeout(() => {
              const botResponse = getBotResponse(inputMessage);
              setMessages(prev => [...prev, { type: 'bot', text: botResponse }]);
              setIsTyping(false);
            }, 1500);
          };

          const handleContactSubmit = () => {
            if (!formData.name || !formData.email || !formData.message) {
              alert('Please fill all fields');
              return;
            }
            setFormSubmitted(true);
            setTimeout(() => {
              setFormSubmitted(false);
              setFormData({ name: '', email: '', message: '' });
            }, 3000);
          };

          const handleSearch = async () => {
            if (!searchQuery.trim()) return;
            
            setIsSearching(true);
            setHasSearched(true);
            setSearchResults([]);
            
            try {
              const mockResults = [
                {
                  title: searchQuery + ' - Wikipedia',
                  url: 'https://en.wikipedia.org/wiki/' + searchQuery.replace(/ /g, '_'),
                  snippet: `Information about ${searchQuery} from Wikipedia. This is a comprehensive encyclopedia article covering history, overview, and detailed information...`,
                  source: 'Wikipedia'
                },
                {
                  title: 'Everything you need to know about ' + searchQuery,
                  url: 'https://example.com/article/' + searchQuery.toLowerCase(),
                  snippet: `A complete guide to understanding ${searchQuery}. Learn about the fundamentals, advanced concepts, and practical applications...`,
                  source: 'Educational Resources'
                },
                {
                  title: searchQuery + ' - Latest News and Updates',
                  url: 'https://news.example.com/' + searchQuery,
                  snippet: `Stay updated with the latest news about ${searchQuery}. Recent developments, expert analysis, and trending topics...`,
                  source: 'News'
                },
                {
                  title: 'Research and Studies on ' + searchQuery,
                  url: 'https://research.example.com/study/' + searchQuery,
                  snippet: `Academic research and scientific studies related to ${searchQuery}. Peer-reviewed articles, data analysis, and findings...`,
                  source: 'Academic'
                },
                {
                  title: searchQuery + ' Community Forum',
                  url: 'https://forum.example.com/topic/' + searchQuery,
                  snippet: `Join discussions about ${searchQuery}. Connect with experts, ask questions, and share knowledge with the community...`,
                  source: 'Community'
                }
              ];
              
              await new Promise(resolve => setTimeout(resolve, 1000));
              setSearchResults(mockResults);
            } catch (error) {
              console.error('Search error:', error);
              setSearchResults([]);
            } finally {
              setIsSearching(false);
            }
          };

          const scrollToSection = (section) => {
            setActiveSection(section);
            setTimeout(() => lucide.createIcons(), 100);
          };

          const stats = [
            { icon: Bot, label: 'Active Bots', value: registeredBots.length || '12+' },
            { icon: TrendingUp, label: 'Queries/Day', value: '10K+' },
            { icon: Award, label: 'Accuracy Rate', value: '99.8%' },
            { icon: Clock, label: 'Avg Response', value: '<1sec' }
          ];

          return (
            <div className="min-h-screen bg-black text-white overflow-hidden relative">
              <div className="fixed inset-0 z-0">
                <div className="absolute inset-0 bg-gradient-to-br from-purple-900/20 via-blue-900/20 to-cyan-900/20"></div>
                <div 
                  className="absolute w-96 h-96 bg-purple-500/30 rounded-full blur-3xl"
                  style={{
                    left: `${mousePosition.x / 20}px`,
                    top: `${mousePosition.y / 20}px`,
                    transition: 'all 0.3s ease-out'
                  }}
                ></div>
                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-pulse"></div>
                <div className="absolute bottom-1/4 left-1/3 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl animate-pulse" style={{animationDelay: '1s'}}></div>
                <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.02)_1px,transparent_1px)] bg-[size:50px_50px]"></div>
              </div>

              <div className="relative z-10">
                <nav className="fixed top-0 w-full z-50 bg-black/40 backdrop-blur-2xl border-b border-white/10">
                  <div className="max-w-7xl mx-auto px-4 py-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-4">
                        <div className="relative">
                          <div className="absolute inset-0 bg-gradient-to-r from-purple-600 to-cyan-600 rounded-2xl blur-xl opacity-75 animate-pulse"></div>
                          <div className="relative bg-gradient-to-r from-purple-600 to-cyan-600 p-3 rounded-2xl">
                            <Icon icon={Bot} className="w-8 h-8 text-white" />
                          </div>
                        </div>
                        <div>
                          <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                            WeKidedia 2026
                          </h1>
                          <p className="text-xs text-gray-400 flex items-center gap-1">
                            <Icon icon={Sparkles} className="w-3 h-3" /> Next-Gen AI Knowledge
                          </p>
                        </div>
                      </div>
                      <div className="hidden md:flex gap-8 items-center">
                        <button onClick={() => scrollToSection('home')} className="text-gray-300 hover:text-white font-medium transition-all hover:scale-110">Home</button>
                        <button onClick={() => scrollToSection('search')} className="text-gray-300 hover:text-white font-medium transition-all hover:scale-110">Search</button>
                        <button onClick={() => scrollToSection('demo')} className="text-gray-300 hover:text-white font-medium transition-all hover:scale-110">Demo</button>
                        <button onClick={() => scrollToSection('bots')} className="text-gray-300 hover:text-white font-medium transition-all hover:scale-110">Bots</button>
                        <button onClick={() => scrollToSection('contact')} className="text-gray-300 hover:text-white font-medium transition-all hover:scale-110">Contact</button>
                        <button 
                          onClick={() => setShowRegisterBot(true)}
                          className="bg-gradient-to-r from-purple-600 to-cyan-600 px-6 py-2 rounded-full font-bold hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transition-all hover:scale-105"
                        >
                          Register Bot
                        </button>
                      </div>
                    </div>
                  </div>
                </nav>

                {activeSection === 'home' && (
                  <section className="pt-40 pb-32 px-4">
                    <div className="max-w-7xl mx-auto">
                      <div className="text-center mb-12">
                        <div className="inline-flex items-center gap-2 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-6 py-3 mb-8">
                          <Icon icon={Sparkles} className="w-4 h-4 text-yellow-400" />
                          <span className="text-sm font-semibold bg-gradient-to-r from-yellow-400 to-orange-400 bg-clip-text text-transparent">
                            Powered by Advanced AI Technology 2026
                          </span>
                        </div>
                        
                        <h1 className="text-7xl md:text-8xl font-black mb-8 leading-tight">
                          <span className="bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">
                            Knowledge
                          </span>
                          <br />
                          <span className="text-white">At Light Speed</span>
                        </h1>
                        
                        <p className="text-xl md:text-2xl text-gray-400 mb-12 max-w-3xl mx-auto">
                          Search the web like Google & Bing, or chat with our AI for Wikipedia-style answers. The ultimate knowledge platform powered by next-generation AI.
                        </p>

                        <div className="flex flex-wrap gap-4 justify-center mb-16">
                          <button 
                            onClick={() => scrollToSection('search')}
                            className="group bg-gradient-to-r from-purple-600 to-cyan-600 px-8 py-4 rounded-2xl font-bold text-lg hover:shadow-[0_0_50px_rgba(168,85,247,0.6)] transition-all hover:scale-105 flex items-center gap-2"
                          >
                            <Icon icon={Search} className="w-5 h-5" />
                            Search Web Now
                            <Icon icon={ArrowRight} className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                          </button>
                          <button 
                            onClick={() => scrollToSection('demo')}
                            className="bg-white/5 backdrop-blur-xl border border-white/10 px-8 py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition-all hover:scale-105"
                          >
                            Try AI Chat
                          </button>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-5xl mx-auto">
                          {stats.map((stat, idx) => (
                            <div key={idx} className="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 hover:bg-white/10 transition-all hover:scale-105">
                              <Icon icon={stat.icon} className="w-8 h-8 text-cyan-400 mb-3 mx-auto" />
                              <div className="text-3xl font-bold bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent mb-1">
                                {stat.value}
                              </div>
                              <div className="text-sm text-gray-400">{stat.label}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="grid md:grid-cols-3 gap-6 mt-20">
                        <div className="bg-gradient-to-br from-purple-900/40 to-purple-600/20 backdrop-blur-xl border border-purple-500/20 rounded-3xl p-8 hover:shadow-[0_0_50px_rgba(168,85,247,0.3)] transition-all hover:scale-105">
                          <Icon icon={Search} className="w-12 h-12 text-purple-400 mb-4" />
                          <h3 className="text-2xl font-bold mb-3">Web Search Engine</h3>
                          <p className="text-gray-400">Search the entire web like Google & Bing. Instant results with AI-powered relevance.</p>
                        </div>
                        
                        <div className="bg-gradient-to-br from-blue-900/40 to-blue-600/20 backdrop-blur-xl border border-blue-500/20 rounded-3xl p-8 hover:shadow-[0_0_50px_rgba(59,130,246,0.3)] transition-all hover:scale-105">
                          <Icon icon={Shield} className="w-12 h-12 text-blue-400 mb-4" />
                          <h3 className="text-2xl font-bold mb-3">99.8% Accurate</h3>
                          <p className="text-gray-400">Verified information from trusted sources. Enterprise-grade reliability.</p>
                        </div>
                        
                        <div className="bg-gradient-to-br from-cyan-900/40 to-cyan-600/20 backdrop-blur-xl border border-cyan-500/20 rounded-3xl p-8 hover:shadow-[0_0_50px_rgba(6,182,212,0.3)] transition-all hover:scale-105">
                          <Icon icon={Bot} className="w-12 h-12 text-cyan-400 mb-4" />
                          <h3 className="text-2xl font-bold mb-3">AI Assistant</h3>
                          <p className="text-gray-400">Chat with our AI bot for Wikipedia-style answers on any topic.</p>
                        </div>
                      </div>
                    </div>
                  </section>
                )}

                {activeSection === 'search' && (
                  <section className="py-20 px-4 pt-32">
                    <div className="max-w-6xl mx-auto">
                      <div className="text-center mb-12">
                        <h2 className="text-5xl md:text-6xl font-bold mb-4 bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">
                          Web Search Engine
                        </h2>
                        <p className="text-xl text-gray-400">Powered by advanced AI • Search the entire web instantly</p>
                      </div>

                      <div className="max-w-4xl mx-auto mb-8">
                        <div className="bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl p-3 shadow-[0_0_50px_rgba(168,85,247,0.2)]">
                          <div className="flex gap-3 mb-3">
                            <input
                              type="text"
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                              placeholder="Search anything on the web..."
                              className="flex-1 px-6 py-5 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl focus:border-purple-500 focus:outline-none text-white text-lg placeholder-gray-500"
                            />
                            <button
                              onClick={handleSearch}
                              disabled={isSearching}
                              className="bg-gradient-to-r from-purple-600 to-cyan-600 px-10 py-5 rounded-2xl font-bold hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transition-all hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                            >
                              <Icon icon={Search} className="w-6 h-6" />
                              {isSearching ? 'Searching...' : 'Search'}
                            </button>
                          </div>
                          
                          <div className="flex items-center gap-4 px-3">
                            <span className="text-sm text-gray-500">Search with:</span>
                            <button
                              onClick={() => setSearchEngine('google')}
                              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${
                                searchEngine === 'google'
                                  ? 'bg-gradient-to-r from-blue-600 to-green-600 text-white'
                                  : 'bg-white/5 text-gray-400 hover:bg-white/10'
                              }`}
                            >
                              🔍 Google-Style
                            </button>
                            <button
                              onClick={() => setSearchEngine('bing')}
                              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${
                                searchEngine === 'bing'
                                  ? 'bg-gradient-to-r from-cyan-600 to-blue-600 text-white'
                                  : 'bg-white/5 text-gray-400 hover:bg-white/10'
                              }`}
                            >
                              🌐 Bing-Style
                            </button>
                            <button
                              onClick={() => setSearchEngine('wiki')}
                              className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${
                                searchEngine === 'wiki'
                                  ? 'bg-gradient-to-r from-orange-600 to-red-600 text-white'
                                  : 'bg-white/5 text-gray-400 hover:bg-white/10'
                              }`}
                            >
                              📚 Wikipedia
                            </button>
                          </div>
                        </div>
                      </div>

                      {isSearching && (
                        <div className="text-center py-20">
                          <div className="inline-block relative">
                            <div className="absolute inset-0 bg-gradient-to-r from-purple-600 to-cyan-600 rounded-full blur-xl opacity-75 animate-pulse"></div>
                            <div className="relative animate-spin rounded-full h-16 w-16 border-4 border-purple-500 border-t-transparent"></div>
                          </div>
                          <p className="text-gray-400 mt-6 text-lg">Searching the web...</p>
                        </div>
                      )}

                      {!isSearching && hasSearched && searchResults.length === 0 && (
                        <div className="text-center py-20 bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl">
                          <Icon icon={Search} className="w-16 h-16 text-gray-600 mx-auto mb-4" />
                          <h3 className="text-2xl font-bold mb-2">No results found</h3>
                          <p className="text-gray-400">Try different keywords or search terms</p>
                        </div>
                      )}

                      {!isSearching && searchResults.length > 0 && (
                        <div className="max-w-4xl mx-auto">
                          <div className="mb-6 text-sm text-gray-400 flex items-center gap-2">
                            <Icon icon={Sparkles} className="w-4 h-4" />
                            About {searchResults.length} results found in 0.{Math.floor(Math.random() * 90 + 10)} seconds
                          </div>
                          
                          <div className="space-y-6">
                            {searchResults.map((result, idx) => (
                              <div 
                                key={idx} 
                                className="group bg-white/5 backdrop-blur-2xl border border-white/10 rounded-2xl p-6 hover:bg-white/10 hover:shadow-[0_0_30px_rgba(168,85,247,0.3)] transition-all hover:scale-[1.02]"
                              >
                                <div className="flex items-start justify-between mb-3">
                                  <div className="flex-1">
                                    <div className="flex items-center gap-2 mb-2">
                                      <Icon icon={Globe} className="w-4 h-4 text-gray-500" />
                                      <span className="text-xs text-gray-500">{result.source}</span>
                                      <span className="text-xs text-gray-700">•</span>
                                      <span className="text-xs text-green-400">{result.url}</span>
                                    </div>
                                    <a 
                                      href={result.url}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="text-2xl font-bold text-purple-400 hover:text-purple-300 transition-colors group-hover:underline"
                                    >
                                      {result.title}
                                    </a>
                                  </div>
                                  <Icon icon={ArrowRight} className="w-5 h-5 text-gray-600 group-hover:text-purple-400 group-hover:translate-x-1 transition-all" />
                                </div>
                                <p className="text-gray-400 leading-relaxed">{result.snippet}</p>
                                <div className="mt-4 flex gap-2">
                                  <button className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-xs font-semibold hover:bg-white/10 transition-all">
                                    📑 Save
                                  </button>
                                  <button className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-xs font-semibold hover:bg-white/10 transition-all">
                                    📤 Share
                                  </button>
                                  <button className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-xs font-semibold hover:bg-white/10 transition-all">
                                    ⭐ Bookmark
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>

                          <div className="text-center mt-8">
                            <button className="bg-white/5 border border-white/10 px-8 py-4 rounded-2xl font-bold hover:bg-white/10 transition-all hover:scale-105">
                              Load More Results
                            </button>
                          </div>
                        </div>
                      )}

                      {!hasSearched && (
                        <div className="max-w-4xl mx-auto mt-12">
                          <h3 className="text-xl font-bold mb-6 text-gray-400">🔥 Trending Searches</h3>
                          <div className="flex flex-wrap gap-3">
                            {['Artificial Intelligence 2026', 'Climate Change Solutions', 'Latest Technology', 'Space Exploration', 'Quantum Computing', 'Renewable Energy', 'AI Ethics', 'Future of Work'].map((term, idx) => (
                              <button
                                key={idx}
                                onClick={() => {
                                  setSearchQuery(term);
                                  setTimeout(handleSearch, 100);
                                }}
                                className="bg-white/5 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-full text-sm font-semibold hover:bg-gradient-to-r hover:from-purple-600 hover:to-cyan-600 hover:border-transparent transition-all hover:scale-105"
                              >
                                {term}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </section>
                )}

                {/* Continuing in next artifact due to length... */}
                
                <footer className="border-t border-white/10 py-12 px-4 mt-20">
                  <div className="max-w-7xl mx-auto text-center">
                    <div className="flex items-center justify-center gap-3 mb-4">
                      <div className="bg-gradient-to-r from-purple-600 to-cyan-600 p-2 rounded-xl">
                        <Icon icon={Bot} className="w-6 h-6" />
                      </div>
                      <span className="text-xl font-bold bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">
                        WeKidedia 2026
                      </span>
                    </div>
                    <p className="text-gray-400 mb-4">Next-Generation AI Knowledge Assistant</p>
                    <p className="text-gray-600 text-sm">© 2026 WeKidedia Bot. All rights reserved.</p>
                  </div>
                </footer>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeKidediaWebsite />);

        // Initialize Lucide icons
        setTimeout(() => {
          if (window.lucide) {
            lucide.createIcons();
          }
        }, 100);
    </script>
</body>
</html>
