<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WeKidedia 2026 – AI Knowledge Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body class="bg-black text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ icon: I, ...props }) =>
      I ? React.createElement(I, props) : null;

    const Bot = lucide.Bot;
    const Search = lucide.Search;
    const Send = lucide.Send;

    function App() {
      const [messages, setMessages] = useState([
        { from: "bot", text: "Hello 👋 I am WeKidedia Bot. Ask me anything!" }
      ]);
      const [input, setInput] = useState("");
      const endRef = useRef(null);

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      const reply = (msg) => {
        const q = msg.toLowerCase();
        if (q.includes("python"))
          return "Python is a popular programming language used in DevOps, AI, and automation.";
        if (q.includes("india"))
          return "India is the world's most populous democracy located in South Asia.";
        return `I searched my knowledge base for "${msg}".`;
      };

      const send = () => {
        if (!input.trim()) return;
        setMessages(m => [...m, { from: "user", text: input }]);
        const userMsg = input;
        setInput("");

        setTimeout(() => {
          setMessages(m => [...m, { from: "bot", text: reply(userMsg) }]);
        }, 800);
      };

      return (
        <div className="min-h-screen flex flex-col items-center">
          <header className="w-full p-6 border-b border-white/10 text-center">
            <div className="flex justify-center items-center gap-3">
              <Icon icon={Bot} className="w-8 h-8 text-purple-400" />
              <h1 className="text-3xl font-bold bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">
                WeKidedia 2026
              </h1>
            </div>
            <p className="text-gray-400 mt-2">
              AI-Powered Knowledge Assistant
            </p>
          </header>

          <main className="flex-1 w-full max-w-3xl p-6">
            <div className="space-y-4">
              {messages.map((m, i) => (
                <div
                  key={i}
                  className={`p-4 rounded-xl max-w-[80%] ${
                    m.from === "user"
                      ? "ml-auto bg-purple-600"
                      : "mr-auto bg-white/10"
                  }`}
                >
                  {m.text}
                </div>
              ))}
              <div ref={endRef}></div>
            </div>
          </main>

          <footer className="w-full max-w-3xl p-4 flex gap-3">
            <input
              className="flex-1 p-3 rounded-xl bg-white/10 border border-white/20 focus:outline-none"
              placeholder="Ask something..."
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && send()}
            />
            <button
              onClick={send}
              className="px-5 rounded-xl bg-gradient-to-r from-purple-600 to-cyan-600 font-bold"
            >
              <Icon icon={Send} className="w-5 h-5" />
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
