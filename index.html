<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeKidedia Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        h1 {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        p {
            font-size: 24px;
            margin: 10px 0;
        }
        .success {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">
            <div class="emoji">🎉</div>
            <h1>SUCCESS!</h1>
            <p>GitHub Pages is Working!</p>
            <p>Website: <strong>sandeep14394413.github.io/wekidedia-bot</strong></p>
            <p style="margin-top: 30px; font-size: 18px;">
                ✅ Your repository is live<br>
                ✅ File uploaded correctly<br>
                ✅ Ready for full website!
            </p>
        </div>
    </div>
</body>
</html>
