<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeKidedia Bot 2026 - AI-powered knowledge assistant with integrated web search engine">
    <meta name="keywords" content="AI, bot, search engine, knowledge, Wikipedia, 2026">
    <title>WeKidedia 2026 - AI Knowledge Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-black">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
          const [section, setSection] = useState('home');
          const [messages, setMessages] = useState([
            { type: 'bot', text: 'Hello! I\'m WeKidedia Bot. Ask me anything or use Web Search!' }
          ]);
          const [inputMessage, setInputMessage] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const messagesEndRef = useRef(null);
          
          const [searchQuery, setSearchQuery] = useState('');
          const [searchResults, setSearchResults] = useState([]);
          const [isSearching, setIsSearching] = useState(false);
          const [hasSearched, setHasSearched] = useState(false);
          const [searchEngine, setSearchEngine] = useState('google');
          
          const [bots, setBots] = useState([]);
          const [loadingBots, setLoadingBots] = useState(true);
          const [showRegister, setShowRegister] = useState(false);
          const [botForm, setBotForm] = useState({
            botName: '', botDescription: '', ownerName: '', ownerEmail: '', category: 'general'
          });
          const [botRegSubmitted, setBotRegSubmitted] = useState(false);
          
          const [mouse, setMouse] = useState({ x: 0, y: 0 });

          useEffect(() => {
            const handleMouse = (e) => setMouse({ x: e.clientX, y: e.clientY });
            window.addEventListener('mousemove', handleMouse);
            loadBots();
            return () => window.removeEventListener('mousemove', handleMouse);
          }, []);

          useEffect(() => {
            if (window.lucide) lucide.createIcons();
          }, [section, searchResults, bots, showRegister, messages]);

          const loadBots = async () => {
            try {
              setLoadingBots(true);
              const keys = await window.storage.list('bot:');
              if (keys?.keys) {
                const loaded = [];
                for (const key of keys.keys) {
                  const result = await window.storage.get(key);
                  if (result?.value) loaded.push(JSON.parse(result.value));
                }
                setBots(loaded);
              }
            } catch (e) {
              setBots([]);
            } finally {
              setLoadingBots(false);
            }
          };

          const registerBot = async () => {
            if (!botForm.botName || !botForm.ownerName || !botForm.ownerEmail) {
              alert('Please fill all required fields');
              return;
            }
            try {
              const id = `bot:${Date.now()}`;
              const data = { id, ...botForm, registeredAt: new Date().toISOString(), status: 'active' };
              await window.storage.set(id, JSON.stringify(data));
              setBotRegSubmitted(true);
              await loadBots();
              setTimeout(() => {
                setBotRegSubmitted(false);
                setBotForm({ botName: '', botDescription: '', ownerName: '', ownerEmail: '', category: 'general' });
                setShowRegister(false);
              }, 3000);
            } catch (e) {
              alert('Failed to register bot');
            }
          };

          const getBotResponse = (msg) => {
            const m = msg.toLowerCase();
            if (m.includes('hello') || m.includes('hi')) return 'Hello! Ask me about any topic - science, history, geography, or anything else!';
            if (m.includes('how') && m.includes('work')) return 'I analyze your questions and provide Wikipedia-style information from my knowledge base.';
            if (m.includes('india')) return 'India is a country in South Asia, the 7th largest by area and most populous democracy in the world.';
            if (m.includes('python')) return 'Python is a high-level programming language created by Guido van Rossum in 1991, known for simplicity and readability.';
            if (m.includes('ai') || m.includes('2026')) return 'By 2026, AI has advanced with better natural language understanding and ethical frameworks!';
            return `I'd search for "${msg}" in my knowledge base. In production, I'd connect to Wikipedia's API for detailed information.`;
          };

          const handleSendMessage = () => {
            if (!inputMessage.trim()) return;
            setMessages([...messages, { type: 'user', text: inputMessage }]);
            setInputMessage('');
            setIsTyping(true);
            setTimeout(() => {
              setMessages(prev => [...prev, { type: 'bot', text: getBotResponse(inputMessage) }]);
              setIsTyping(false);
            }, 1500);
          };

          const handleSearch = async () => {
            if (!searchQuery.trim()) return;
            setIsSearching(true);
            setHasSearched(true);
            setSearchResults([]);
            await new Promise(r => setTimeout(r, 1000));
            setSearchResults([
              { title: `${searchQuery} - Wikipedia`, url: `https://en.wikipedia.org/wiki/${searchQuery.replace(/ /g, '_')}`, snippet: `Comprehensive information about ${searchQuery} from Wikipedia encyclopedia...`, source: 'Wikipedia' },
              { title: `Complete Guide to ${searchQuery}`, url: '#', snippet: `Learn everything about ${searchQuery} with detailed explanations and examples...`, source: 'Educational' },
              { title: `${searchQuery} - Latest News`, url: '#', snippet: `Stay updated with recent developments and news about ${searchQuery}...`, source: 'News' },
              { title: `Research on ${searchQuery}`, url: '#', snippet: `Academic studies and peer-reviewed research about ${searchQuery}...`, source: 'Academic' },
              { title: `${searchQuery} Community`, url: '#', snippet: `Join discussions and connect with experts about ${searchQuery}...`, source: 'Community' }
            ]);
            setIsSearching(false);
          };

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]);

          const stats = [
            { icon: 'bot', label: 'Active Bots', value: bots.length || '12+' },
            { icon: 'trending-up', label: 'Queries/Day', value: '10K+' },
            { icon: 'award', label: 'Accuracy', value: '99.8%' },
            { icon: 'clock', label: 'Response', value: '<1sec' }
          ];

          return (
            <div className="min-h-screen bg-black text-white overflow-hidden relative">
              {/* Background */}
              <div className="fixed inset-0 z-0">
                <div className="absolute inset-0 bg-gradient-to-br from-purple-900/20 via-blue-900/20 to-cyan-900/20"></div>
                <div className="absolute w-96 h-96 bg-purple-500/30 rounded-full blur-3xl" style={{ left: `${mouse.x/20}px`, top: `${mouse.y/20}px`, transition: 'all 0.3s' }}></div>
                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-pulse"></div>
                <div className="absolute bottom-1/4 left-1/3 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl animate-pulse" style={{animationDelay: '1s'}}></div>
                <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.02)_1px,transparent_1px)] bg-[size:50px_50px]"></div>
              </div>

              <div className="relative z-10">
                {/* Navigation */}
                <nav className="fixed top-0 w-full z-50 bg-black/40 backdrop-blur-2xl border-b border-white/10">
                  <div className="max-w-7xl mx-auto px-4 py-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-4">
                        <div className="relative">
                          <div className="absolute inset-0 bg-gradient-to-r from-purple-600 to-cyan-600 rounded-2xl blur-xl opacity-75 animate-pulse"></div>
                          <div className="relative bg-gradient-to-r from-purple-600 to-cyan-600 p-3 rounded-2xl">
                            <i data-lucide="bot" className="w-8 h-8"></i>
                          </div>
                        </div>
                        <div>
                          <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">WeKidedia 2026</h1>
                          <p className="text-xs text-gray-400 flex items-center gap-1"><i data-lucide="sparkles" className="w-3 h-3"></i> Next-Gen AI</p>
                        </div>
                      </div>
                      <div className="hidden md:flex gap-6 items-center">
                        <button onClick={() => setSection('home')} className="text-gray-300 hover:text-white transition">Home</button>
                        <button onClick={() => setSection('search')} className="text-gray-300 hover:text-white transition">Search</button>
                        <button onClick={() => setSection('demo')} className="text-gray-300 hover:text-white transition">AI Chat</button>
                        <button onClick={() => setSection('bots')} className="text-gray-300 hover:text-white transition">Bots</button>
                        <button onClick={() => setShowRegister(true)} className="bg-gradient-to-r from-purple-600 to-cyan-600 px-6 py-2 rounded-full font-bold hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transition">Register Bot</button>
                      </div>
                    </div>
                  </div>
                </nav>

                {/* Home Section */}
                {section === 'home' && (
                  <section className="pt-40 pb-32 px-4">
                    <div className="max-w-7xl mx-auto">
                      <div className="text-center mb-12">
                        <div className="inline-flex items-center gap-2 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-6 py-3 mb-8">
                          <i data-lucide="sparkles" className="w-4 h-4 text-yellow-400"></i>
                          <span className="text-sm font-semibold bg-gradient-to-r from-yellow-400 to-orange-400 bg-clip-text text-transparent">Powered by AI Technology 2026</span>
                        </div>
                        <h1 className="text-7xl md:text-8xl font-black mb-8 leading-tight">
                          <span className="bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">Knowledge</span><br/>
                          <span className="text-white">At Light Speed</span>
                        </h1>
                        <p className="text-xl md:text-2xl text-gray-400 mb-12 max-w-3xl mx-auto">Search the web like Google & Bing, or chat with AI for Wikipedia-style answers. The ultimate knowledge platform.</p>
                        
                        <div className="flex flex-wrap gap-4 justify-center mb-16">
                          <button onClick={() => setSection('search')} className="group bg-gradient-to-r from-purple-600 to-cyan-600 px-8 py-4 rounded-2xl font-bold text-lg hover:shadow-[0_0_50px_rgba(168,85,247,0.6)] transition-all hover:scale-105 flex items-center gap-2">
                            <i data-lucide="search" className="w-5 h-5"></i>
                            Search Web Now
                            <i data-lucide="arrow-right" className="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                          </button>
                          <button onClick={() => setSection('demo')} className="bg-white/5 backdrop-blur-xl border border-white/10 px-8 py-4 rounded-2xl font-bold text-lg hover:bg-white/10 transition-all hover:scale-105">Try AI Chat</button>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-5xl mx-auto">
                          {stats.map((stat, i) => (
                            <div key={i} className="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-6 hover:bg-white/10 transition-all hover:scale-105">
                              <i data-lucide={stat.icon} className="w-8 h-8 text-cyan-400 mb-3 mx-auto"></i>
                              <div className="text-3xl font-bold bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent mb-1">{stat.value}</div>
                              <div className="text-sm text-gray-400">{stat.label}</div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="grid md:grid-cols-3 gap-6 mt-20">
                        <div className="bg-gradient-to-br from-purple-900/40 to-purple-600/20 backdrop-blur-xl border border-purple-500/20 rounded-3xl p-8 hover:shadow-[0_0_50px_rgba(168,85,247,0.3)] transition-all hover:scale-105">
                          <i data-lucide="search" className="w-12 h-12 text-purple-400 mb-4"></i>
                          <h3 className="text-2xl font-bold mb-3">Web Search Engine</h3>
                          <p className="text-gray-400">Search the web like Google & Bing with AI-powered results.</p>
                        </div>
                        <div className="bg-gradient-to-br from-blue-900/40 to-blue-600/20 backdrop-blur-xl border border-blue-500/20 rounded-3xl p-8 hover:shadow-[0_0_50px_rgba(59,130,246,0.3)] transition-all hover:scale-105">
                          <i data-lucide="shield" className="w-12 h-12 text-blue-400 mb-4"></i>
                          <h3 className="text-2xl font-bold mb-3">99.8% Accurate</h3>
                          <p className="text-gray-400">Verified information from trusted sources worldwide.</p>
                        </div>
                        <div className="bg-gradient-to-br from-cyan-900/40 to-cyan-600/20 backdrop-blur-xl border border-cyan-500/20 rounded-3xl p-8 hover:shadow-[0_0_50px_rgba(6,182,212,0.3)] transition-all hover:scale-105">
                          <i data-lucide="bot" className="w-12 h-12 text-cyan-400 mb-4"></i>
                          <h3 className="text-2xl font-bold mb-3">AI Assistant</h3>
                          <p className="text-gray-400">Chat with AI for Wikipedia-style answers instantly.</p>
                        </div>
                      </div>
                    </div>
                  </section>
                )}

                {/* Search Engine Section */}
                {section === 'search' && (
                  <section className="pt-32 pb-20 px-4">
                    <div className="max-w-6xl mx-auto">
                      <div className="text-center mb-12">
                        <h2 className="text-5xl md:text-6xl font-bold mb-4 bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">Web Search Engine</h2>
                        <p className="text-xl text-gray-400">Search the entire web instantly • Powered by AI</p>
                      </div>

                      <div className="max-w-4xl mx-auto mb-8">
                        <div className="bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl p-3 shadow-[0_0_50px_rgba(168,85,247,0.2)]">
                          <div className="flex gap-3 mb-3">
                            <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSearch()} placeholder="Search anything on the web..." className="flex-1 px-6 py-5 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl focus:border-purple-500 focus:outline-none text-white text-lg placeholder-gray-500"/>
                            <button onClick={handleSearch} disabled={isSearching} className="bg-gradient-to-r from-purple-600 to-cyan-600 px-10 py-5 rounded-2xl font-bold hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transition-all hover:scale-105 disabled:opacity-50 flex items-center gap-2">
                              <i data-lucide="search" className="w-6 h-6"></i>
                              {isSearching ? 'Searching...' : 'Search'}
                            </button>
                          </div>
                          <div className="flex items-center gap-4 px-3">
                            <span className="text-sm text-gray-500">Search with:</span>
                            {['google', 'bing', 'wiki'].map(engine => (
                              <button key={engine} onClick={() => setSearchEngine(engine)} className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${searchEngine === engine ? 'bg-gradient-to-r from-blue-600 to-green-600 text-white' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}>
                                {engine === 'google' ? '🔍 Google' : engine === 'bing' ? '🌐 Bing' : '📚 Wiki'}
                              </button>
                            ))}
                          </div>
                        </div>
                      </div>

                      {isSearching && (
                        <div className="text-center py-20">
                          <div className="inline-block relative">
                            <div className="absolute inset-0 bg-gradient-to-r from-purple-600 to-cyan-600 rounded-full blur-xl opacity-75 animate-pulse"></div>
                            <div className="relative animate-spin rounded-full h-16 w-16 border-4 border-purple-500 border-t-transparent"></div>
                          </div>
                          <p className="text-gray-400 mt-6 text-lg">Searching the web...</p>
                        </div>
                      )}

                      {!isSearching && searchResults.length > 0 && (
                        <div className="max-w-4xl mx-auto">
                          <div className="mb-6 text-sm text-gray-400 flex items-center gap-2">
                            <i data-lucide="sparkles" className="w-4 h-4"></i>
                            About {searchResults.length} results in 0.{Math.floor(Math.random()*90+10)} seconds
                          </div>
                          <div className="space-y-6">
                            {searchResults.map((r, i) => (
                              <div key={i} className="group bg-white/5 backdrop-blur-2xl border border-white/10 rounded-2xl p-6 hover:bg-white/10 hover:shadow-[0_0_30px_rgba(168,85,247,0.3)] transition-all hover:scale-[1.02]">
                                <div className="flex items-start justify-between mb-3">
                                  <div className="flex-1">
                                    <div className="flex items-center gap-2 mb-2">
                                      <i data-lucide="globe" className="w-4 h-4 text-gray-500"></i>
                                      <span className="text-xs text-gray-500">{r.source}</span>
                                      <span className="text-xs text-gray-700">•</span>
                                      <span className="text-xs text-green-400">{r.url}</span>
                                    </div>
                                    <a href={r.url} target="_blank" rel="noopener noreferrer" className="text-2xl font-bold text-purple-400 hover:text-purple-300 transition group-hover:underline">{r.title}</a>
                                  </div>
                                  <i data-lucide="arrow-right" className="w-5 h-5 text-gray-600 group-hover:text-purple-400 group-hover:translate-x-1 transition-all"></i>
                                </div>
                                <p className="text-gray-400 leading-relaxed">{r.snippet}</p>
                                <div className="mt-4 flex gap-2">
                                  <button className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-xs font-semibold hover:bg-white/10 transition">📑 Save</button>
                                  <button className="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-xs font-semibold hover:bg-white/10 transition">📤 Share</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {!hasSearched && (
                        <div className="max-w-4xl mx-auto mt-12">
                          <h3 className="text-xl font-bold mb-6 text-gray-400">🔥 Trending Searches</h3>
                          <div className="flex flex-wrap gap-3">
                            {['AI 2026', 'Climate Change', 'Technology', 'Space', 'Quantum Computing', 'Renewable Energy'].map(term => (
                              <button key={term} onClick={() => { setSearchQuery(term); setTimeout(handleSearch, 100); }} className="bg-white/5 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-full text-sm font-semibold hover:bg-gradient-to-r hover:from-purple-600 hover:to-cyan-600 transition-all hover:scale-105">{term}</button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </section>
                )}

                {/* AI Chat Demo Section */}
                {section === 'demo' && (
                  <section className="pt-32 pb-20 px-4">
                    <div className="max-w-5xl mx-auto">
                      <div className="text-center mb-12">
                        <h2 className="text-5xl font-bold mb-4 bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">AI Chat Assistant</h2>
                        <p className="text-xl text-gray-400">Ask me anything - get Wikipedia-style answers</p>
                      </div>
                      
                      <div className="bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl overflow-hidden shadow-[0_0_100px_rgba(168,85,247,0.2)]">
                        <div className="bg-gradient-to-r from-purple-600/20 to-cyan-600/20 p-6 flex items-center gap-4 border-b border-white/10">
                          <div className="bg-gradient-to-r from-purple-600 to-cyan-600 p-3 rounded-xl">
                            <i data-lucide="bot" className="w-8 h-8"></i>
                          </div>
                          <div>
                            <div className="font-bold text-lg">WeKidedia AI</div>
                            <div className="text-xs text-green-400 flex items-center gap-1">
                              <span className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Online • 2026 Model
                            </div>
                          </div>
                        </div>

                        <div className="h-96 overflow-y-auto p-6 space-y-4">
                          {messages.map((msg, i) => (
                            <div key={i} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                              <div className={`max-w-[80%] rounded-2xl p-4 ${msg.type === 'user' ? 'bg-gradient-to-r from-purple-600 to-cyan-600 text-white shadow-[0_0_20px_rgba(168,85,247,0.3)]' : 'bg-white/10 backdrop-blur-xl border border-white/10 text-white'}`}>
                                {msg.type === 'bot' && (
                                  <div className="flex items-center gap-2 mb-2">
                                    <i data-lucide="bot" className="w-4 h-4 text-cyan-400"></i>
                                    <span className="text-xs font-semibold text-cyan-400">WeKidedia</span>
                                  </div>
                                )}
                                <p className="text-sm">{msg.text}</p>
                              </div>
                            </div>
                          ))}
                          {isTyping && (
                            <div className="flex justify-start">
                              <div className="bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-4">
                                <div className="flex gap-1">
                                  <span className="w-2 h-2 bg-cyan-400 rounded-full animate-bounce"></span>
                                  <span className="w-2 h-2 bg-cyan-400 rounded-full animate-bounce" style={{animationDelay:'0.1s'}}></span>
                                  <span className="w-2 h-2 bg-cyan-400 rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></span>
                                </div>
                              </div>
                            </div>
                          )}
                          <div ref={messagesEndRef} />
                        </div>

                        <div className="p-6 border-t border-white/10">
                          <div className="flex gap-3">
                            <input type="text" value={inputMessage} onChange={(e) => setInputMessage(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()} placeholder="Ask anything..." className="flex-1 px-6 py-4 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl focus:border-purple-500 focus:outline-none text-white placeholder-gray-500"/>
                            <button onClick={handleSendMessage} className="bg-gradient-to-r from-purple-600 to-cyan-600 px-8 py-4 rounded-2xl hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transition-all hover:scale-105">
                              <i data-lucide="send" className="w-5 h-5"></i>
                            </button>
                          </div>
                          <p className="text-xs text-gray-500 mt-3 flex items-center gap-2">
                            <i data-lucide="sparkles" className="w-3 h-3"></i>
                            Try: "Tell me about India", "What is Python?", "How does AI work?"
                          </p>
                        </div>
                      </div>
                    </div>
                  </section>
                )}

                {/* Bot Registry Section */}
                {section === 'bots' && (
                  <section className="pt-32 pb-20 px-4">
                    <div className="max-w-7xl mx-auto">
                      <div className="text-center mb-12">
                        <h2 className="text-5xl font-bold mb-4 bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">Bot Registry 2026</h2>
                        <p className="text-xl text-gray-400 mb-8">Join our growing ecosystem of AI assistants</p>
                        <button onClick={() => setShowRegister(true)} className="bg-gradient-to-r from-purple-600 to-cyan-600 px-8 py-4 rounded-2xl font-bold hover:shadow-[0_0_50px_rgba(168,85,247,0.6)] transition-all hover:scale-105 inline-flex items-center gap-2">
                          <i data-lucide="sparkles" className="w-5 h-5"></i>
                          Register Your Bot
                        </button>
                      </div>

                      {loadingBots ? (
                        <div className="text-center py-20">
                          <div className="animate-spin rounded-full h-16 w-16 border-4 border-purple-500 border-t-transparent mx-auto"></div>
                          <p className="text-gray-400 mt-6">Loading bots...</p>
                        </div>
                      ) : bots.length === 0 ? (
                        <div className="text-center py-20 bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl">
                          <i data-lucide="bot" className="w-20 h-20 text-gray-600 mx-auto mb-6"></i>
                          <h3 className="text-2xl font-bold mb-3">No Bots Registered Yet</h3>
                          <p className="text-gray-400 mb-8">Be a pioneer! Register the first bot.</p>
                          <button onClick={() => setShowRegister(true)} className="bg-gradient-to-r from-purple-600 to-cyan-600 px-8 py-4 rounded-2xl font-bold">Register First Bot</button>
                        </div>
                      ) : (
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {bots.map((bot, i) => (
                            <div key={i} className="group bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl p-6 hover:bg-white/10 hover:shadow-[0_0_50px_rgba(168,85,247,0.3)] transition-all hover:scale-105">
                              <div className="flex items-start gap-4 mb-4">
                                <div className="bg-gradient-to-r from-purple-600 to-cyan-600 p-3 rounded-xl">
                                  <i data-lucide="bot" className="w-6 h-6"></i>
                                </div>
                                <div className="flex-1">
                                  <h3 className="font-bold text-lg mb-1">{bot.botName}</h3>
                                  <span className="text-xs bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full font-semibold border border-purple-500/30">{bot.category}</span>
                                </div>
                              </div>
                              <p className="text-sm text-gray-400 mb-4">{bot.botDescription}</p>
                              <div className="border-t border-white/10 pt-4 space-y-2">
                                <div className="flex items-center gap-2 text-xs text-gray-500">
                                  <i data-lucide="user" className="w-4 h-4"></i>
                                  <span>{bot.ownerName}</span>
                                </div>
                                <div className="flex items-center gap-2 text-xs text-gray-500">
                                  <i data-lucide="mail" className="w-4 h-4"></i>
                                  <span className="truncate">{bot.ownerEmail}</span>
                                </div>
                                <div className="flex items-center gap-2 text-xs text-green-400 font-semibold mt-3">
                                  <i data-lucide="check-circle" className="w-4 h-4"></i>
                                  Active • 2026
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </section>
                )}

                {/* Bot Registration Modal */}
                {showRegister && (
                  <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                    <div className="bg-black/40 backdrop-blur-2xl border border-white/10 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-[0_0_100px_rgba(168,85,247,0.5)]">
                      <div className="bg-gradient-to-r from-purple-600/20 to-cyan-600/20 p-6 border-b border-white/10">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <div className="bg-gradient-to-r from-purple-600 to-cyan-600 p-3 rounded-xl">
                              <i data-lucide="bot" className="w-8 h-8"></i>
                            </div>
                            <h3 className="text-2xl font-bold">Register Your Bot</h3>
                          </div>
                          <button onClick={() => setShowRegister(false)} className="hover:bg-white/10 p-2 rounded-xl transition">
                            <i data-lucide="x" className="w-6 h-6"></i>
                          </button>
                        </div>
                      </div>

                      <div className="p-8">
                        {botRegSubmitted ? (
                          <div className="text-center py-12">
                            <div className="w-20 h-20 bg-green-500/20 border-2 border-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
                              <i data-lucide="check-circle" className="w-10 h-10 text-green-400"></i>
                            </div>
                            <h3 className="text-3xl font-bold mb-3">Bot Registered! 🎉</h3>
                            <p className="text-gray-400">Your bot is now part of the 2026 ecosystem.</p>
                          </div>
                        ) : (
                          <div className="space-y-6">
                            <input type="text" value={botForm.botName} onChange={(e) => setBotForm({...botForm, botName: e.target.value})} placeholder="Bot Name *" className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500"/>
                            <textarea value={botForm.botDescription} onChange={(e) => setBotForm({...botForm, botDescription: e.target.value})} rows="3" placeholder="Description" className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500"/>
                            <select value={botForm.category} onChange={(e) => setBotForm({...botForm, category: e.target.value})} className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-purple-500">
                              <option value="general">General Knowledge</option>
                              <option value="education">Education</option>
                              <option value="entertainment">Entertainment</option>
                              <option value="business">Business</option>
                              <option value="technology">Technology</option>
                            </select>
                            <input type="text" value={botForm.ownerName} onChange={(e) => setBotForm({...botForm, ownerName: e.target.value})} placeholder="Owner Name *" className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500"/>
                            <input type="email" value={botForm.ownerEmail} onChange={(e) => setBotForm({...botForm, ownerEmail: e.target.value})} placeholder="Owner Email *" className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500"/>
                            <div className="flex gap-4 pt-4">
                              <button onClick={() => setShowRegister(false)} className="flex-1 bg-white/5 border border-white/10 py-4 rounded-xl font-bold hover:bg-white/10 transition">Cancel</button>
                              <button onClick={registerBot} className="flex-1 bg-gradient-to-r from-purple-600 to-cyan-600 py-4 rounded-xl font-bold hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transition">Register Bot</button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* Footer */}
                <footer className="border-t border-white/10 py-12 px-4 mt-20">
                  <div className="max-w-7xl mx-auto text-center">
                    <div className="flex items-center justify-center gap-3 mb-4">
                      <div className="bg-gradient-to-r from-purple-600 to-cyan-600 p-2 rounded-xl">
                        <i data-lucide="bot" className="w-6 h-6"></i>
                      </div>
                      <span className="text-xl font-bold bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent">WeKidedia 2026</span>
                    </div>
                    <p className="text-gray-400 mb-2">Next-Generation AI Knowledge Assistant</p>
                    <p className="text-gray-600 text-sm">© 2026 WeKidedia Bot. All rights reserved.</p>
                  </div>
                </footer>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
    </script>
</body>
</html>
